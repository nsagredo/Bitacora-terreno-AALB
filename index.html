<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071823"><title>Bitácora de Terreno</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body><header><small>ALMAR · OPERACIÓN LOCAL</small><h1>Bitácora de Terreno</h1><span id="status">● Local</span></header><nav><button class="on" data-t="reg">＋ Registrar</button><button data-t="datos">☷ Datos</button><button data-t="graf">⌁ Gráficos</button><button data-t="cat">▦ Plantas</button></nav><main><section id="reg" class="tab on"><div class="card"><h2>Seleccionar planta</h2><div class="grid"><label>Cliente<select id="cliente"></select></label><label>Faena<select id="faena"></select></label><label>Tipo<select id="tipo"></select></label><label>Planta<select id="planta"></select></label></div><div id="meta"></div></div><form id="form"><div class="card"><div class="grid"><label>Operador<input id="operador" required></label><label>Fecha<input id="fecha" type="date" required></label><label>Hora<input id="hora" type="time" required></label><label>Punto de muestreo<select id="punto"><option>Afluente</option><option>Pretratamiento</option><option>Tratamiento</option><option>Efluente / agua tratada</option><option>Otro</option></select></label></div></div><div class="card"><h2>Lecturas</h2><div id="lecturas" class="readings"></div></div><div class="card"><label>Observaciones<textarea id="obs"></textarea></label><button class="primary">Guardar muestreo</button><p id="msg"></p></div></form></section><section id="datos" class="tab"><div class="card"><div class="between"><h2>Datos</h2><button id="csv">Exportar CSV</button></div><div id="lista"></div></div></section><section id="graf" class="tab"><div class="card"><h2>Gráficos</h2><div class="grid"><label>Parámetro<select id="gp"></select></label><label>Planta<select id="gpl"><option value="">Todas</option></select></label></div><div id="kpis"></div><canvas id="chart" width="900" height="420"></canvas></div></section><section id="cat" class="tab"><div class="card"><div class="between"><h2>Catastro de plantas</h2><b>68 registros</b></div><input id="buscar" placeholder="Buscar cliente, faena o planta"><div id="catalogo"></div></div></section></main><script src="catalogo.js"></script><script src="app.js"></script></body></html>
